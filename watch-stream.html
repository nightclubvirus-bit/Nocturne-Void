    console.error("Could not load live chat:", error);
    vlChatMessages.textContent = "Could not load chat messages.";
    return;
  }

  vlChatMessages.innerHTML = "";

  if (!messages || messages.length === 0) {
    vlChatMessages.textContent = "No messages yet. Start the conversation!";
    return;
  }

  const userIds = [...new Set(messages.map(message => message.user_id))];

  const { data: profiles, error: profileError } = await watchSupabase
    .from("community_profiles")
    .select("id, username")
    .in("id", userIds);

  if (profileError) {
    console.error("Could not load chat usernames:", profileError);
  }

  const { data: moderators, error: moderatorError } = await watchSupabase
    .from("void_live_chat_moderators")
    .select("moderator_id")
    .eq("stream_id", streamId);

 if (moderatorError) {
  console.error("Could not load moderators:", moderatorError);
}

const { data: restrictions, error: restrictionError } = await watchSupabase
  .from("void_live_chat_restrictions")
  .select("user_id, restriction_type, expires_at")
  .eq("stream_id", streamId);

if (restrictionError) {
  console.error("Could not load chat restrictions:", restrictionError);
}

messages.forEach(message => { 
  
    const profile = (profiles || []).find(
      profile => profile.id === message.user_id
    );

    const username = profile?.username || "UNKNOWN MEMBER";
    const isStreamer = message.user_id === streamOwnerId;
    const isModerator = (moderators || []).some(
  moderator => moderator.moderator_id === message.user_id
);

    const messageElement = document.createElement("div");
    messageElement.className = "vl-chat-message";

    const sender = document.createElement("strong");

    sender.textContent = isStreamer
  ? `${username} - STREAMER`
  : isModerator
    ? `${username} - MODERATOR`
    : `${username} - VOID MEMBER`;
    if (isModerator) {
  sender.style.color = "#60a5fa";
}

    if (isStreamer) {
      sender.style.color = "#c084fc";
    }
    const { data: restrictions, error: restrictionError } = await watchSupabase
  .from("void_live_chat_restrictions")

  .eq("stream_id", streamId);

if (restrictionError) {
  console.error("Could not load chat restrictions:", restrictionError);
}

const restriction = (restrictions || []).find(
  item => item.user_id === message.user_id
);

if (restriction) {
  if (
    restriction.restriction_type === "ban" ||
    (
      restriction.restriction_type === "timeout" &&
      restriction.expires_at &&
      new Date(restriction.expires_at) > new Date()
    )
  ) {
    return;
  }
}
    const restriction = (restrictions || []).find(
  item => item.user_id === message.user_id
);

if (restriction) {
  if (
    restriction.restriction_type === "ban" ||
    (
      restriction.restriction_type === "timeout" &&
      restriction.expires_at &&
      new Date(restriction.expires_at) > new Date()
    )
  ) {
    return;
  }
}
    const content = document.createElement("p");
    content.textContent = message.message;

  messageElement.append(sender, content);

const canModerate = isStreamer ||
  (moderators || []).some(
    moderator => moderator.moderator_id === sessionData.session?.user.id
  );

if (canModerate) {
  const deleteButton = document.createElement("button");
  deleteButton.textContent = "DELETE";
  deleteButton.className = "vl-chat-delete";

  deleteButton.addEventListener("click", async () => {
    if (!confirm("Delete this chat message?")) return;

    const { error } = await watchSupabase
      .from("void_live_chat")
      .delete()
      .eq("id", message.id)
      .eq("stream_id", streamId);

    if (error) {
      console.error("Could not delete message:", error);
      alert("Could not delete message.");
      return;
    }

    await loadLiveChat();
  });

  messageElement.appendChild(deleteButton);
}
  if (canModerate && !isStreamer && message.user_id !== sessionData.session?.user.id) {
  const timeoutButton = document.createElement("button");
  timeoutButton.textContent = "TIMEOUT";
  timeoutButton.className = "vl-chat-delete";

  timeoutButton.addEventListener("click", async () => {
    const minutes = Number(prompt("Timeout duration in minutes:", "10"));

    if (!minutes || minutes < 1) return;

    const { data: currentUser } = await watchSupabase.auth.getUser();

    const { error } = await watchSupabase
      .from("void_live_chat_restrictions")
      .upsert({
        stream_id: streamId,

        restricted_by: currentUser.user.id,
        restriction_type: "timeout",
        expires_at: new Date(Date.now() + minutes * 60000).toISOString()
      }, {
        onConflict: "stream_id,user_id"
      });

    if (error) {
      console.error("Could not timeout member:", error);
      alert("Could not timeout member.");
      return;
    }

    await loadLiveChat();
  });

  const banButton = document.createElement("button");
  banButton.textContent = "BAN";
  banButton.className = "vl-chat-delete";

  banButton.addEventListener("click", async () => {

    const { data: currentUser } = await watchSupabase.auth.getUser();

    const { error } = await watchSupabase

      .upsert({

vlEndStream.addEventListener("click", async () => {
  const confirmEnd = confirm(
    "Are you sure you want to end your stream?"
  );

  if (!confirmEnd) return;

  const { error } = await watchSupabase
    .from("void_live_streams")
    .update({ is_live: false })
    .eq("id", streamId)
    .eq("user_id", streamOwnerId);

  if (error) {
    console.error("Could not end stream:", error);
    alert("Could not end your stream. Please try again.");
    return;
  }

  alert("Your stream has ended.");
  window.location.href = "void-live.html";
});
    
  async function loadWatchedStream() {
    if (!streamId) {
      document.getElementById("vlWatchTitle").textContent =
        "No stream selected";
      return;
    }

    const { data: stream, error } = await watchSupabase
      .from("void_live_streams")
      .select("*")
      .eq("id", streamId)
      .eq("is_live", true)
      .single();

    if (error || !stream) {
      document.getElementById("vlWatchTitle").textContent =
        "Stream not found or offline.";
      return;
    }
    
   streamOwnerId = stream.user_id;
    const { data: followSession } = await watchSupabase.auth.getSession();
const currentFollower = followSession.session?.user;

if (currentFollower && currentFollower.id !== streamOwnerId) {
  vlFollowButton.style.display = "inline-block";

  const { data: existingFollow } = await watchSupabase
    .from("void_live_follows")
    .select("id")
    .eq("follower_id", currentFollower.id)
    .eq("streamer_id", streamOwnerId)
    .maybeSingle();

  vlFollowButton.textContent = existingFollow
    ? "UNFOLLOW STREAMER"
    : "FOLLOW STREAMER";
}

const { data: sessionData } = await watchSupabase.auth.getSession();

if (sessionData.session?.user.id === streamOwnerId) {
  vlEndStream.style.display = "inline-block";
  vlManageModerators.style.display = "inline-block";
 vlManageModerators.addEventListener("click", async () => {
  const action = prompt(
    "Type ADD to promote a moderator or REMOVE to remove one:"
  );

  if (!action) return;

  const username = prompt("Enter the member's username:");

  if (!username) return;

  const { data: profile, error: profileError } = await watchSupabase
    .from("community_profiles")
    .select("id, username")
    .ilike("username", username.trim())
    .maybeSingle();

  if (profileError || !profile) {
    alert("Member not found.");
    return;
  }

  if (profile.id === streamOwnerId) {
    alert("The streamer cannot be a moderator.");
    return;
  }

  if (action.trim().toUpperCase() === "ADD") {
    const { error } = await watchSupabase
      .from("void_live_chat_moderators")
      .insert({
        stream_id: streamId,
        moderator_id: profile.id,
        assigned_by: sessionData.session.user.id
      });

    if (error) {
      console.error("Could not assign moderator:", error);
      alert("Could not assign moderator. They may already be one.");
      return;
    }

    alert(profile.username + " is now a moderator!");

  } else if (action.trim().toUpperCase() === "REMOVE") {
    const { error } = await watchSupabase
      .from("void_live_chat_moderators")
      .delete()
      .eq("stream_id", streamId)
      .eq("moderator_id", profile.id);

    if (error) {
      console.error("Could not remove moderator:", error);
      alert("Could not remove moderator.");
      return;
    }

    alert(profile.username + " is no longer a moderator!");

  } else {
    alert("Please type ADD or REMOVE.");
    return;
  }

  await loadLiveChat();
});
  
}

const currentUser = sessionData.session?.user;

if (currentUser) {
  const { error: viewerError } = await watchSupabase
    .from("void_live_viewers")
    .upsert({
      stream_id: streamId,
      user_id: currentUser.id,
      last_seen: new Date().toISOString()
    }, {
      onConflict: "stream_id,user_id"
    });

  if (viewerError) {
    console.error("Could not register viewer:", viewerError);
  }
}
    const updateViewerCount = async () => {
  const activeSince = new Date(Date.now() - 60000).toISOString();

  if (currentUser) {
    await watchSupabase
      .from("void_live_viewers")
      .update({ last_seen: new Date().toISOString() })
      .eq("stream_id", streamId)
      .eq("user_id", currentUser.id);
  }

  const { data: viewers, error } = await watchSupabase
    .from("void_live_viewers")
    .select("user_id")
    .eq("stream_id", streamId)
    .neq("user_id", streamOwnerId)
    .gte("last_seen", activeSince);

  if (error) {
    console.error("Could not load viewers:", error);
    return;
  }

  vlViewerCount.textContent =
    "👁 " + viewers.length + " VIEWERS";

  vlViewerList.innerHTML = "";

  if (viewers.length === 0) {
    vlViewerList.textContent = "No viewers watching yet.";
    return;
  }

  const userIds = viewers.map(viewer => viewer.user_id);

  const { data: profiles, error: profileError } = await watchSupabase
    .from("community_profiles")
    .select("id, username")
    .in("id", userIds);

  if (profileError) {
    console.error("Could not load viewer profiles:", profileError);
  }

  viewers.forEach(viewer => {
    const profile = (profiles || []).find(
      profile => profile.id === viewer.user_id
    );

    const viewerElement = document.createElement("p");

    viewerElement.textContent =
      "🟢 " + (profile?.username || "VOID MEMBER");

    vlViewerList.appendChild(viewerElement);
  });
};
    
updateViewerCount();
setInterval(updateViewerCount, 20000);
    
    document.getElementById("vlWatchTitle").textContent =
      stream.stream_title;

    document.getElementById("vlWatchGame").textContent =
      "Playing: " + stream.game_name;

    document.getElementById("vlWatchDescription").textContent =
      stream.description || "";
  
    const player = document.getElementById("vlVideoPlayer");

if (stream.platform === "twitch" && stream.stream_url) {
  const twitchChannel = new URL(stream.stream_url).pathname
    .split("/")
    .filter(Boolean)[0];

  const iframe = document.createElement("iframe");

  iframe.src =
    "https://player.twitch.tv/?channel=" +
    encodeURIComponent(twitchChannel) +
    "&parent=" + encodeURIComponent(window.location.hostname) +
    "&autoplay=false&muted=true";

  iframe.allowFullscreen = true;
  iframe.allow = "autoplay; fullscreen";
  iframe.style.cssText = "width:100%;height:100%;border:0;";

  player.innerHTML = "";
  player.appendChild(iframe);
}

if (stream.platform === "youtube" && stream.stream_url) {
  const youtubeURL = new URL(stream.stream_url);

  let videoId = youtubeURL.searchParams.get("v");

  if (!videoId && youtubeURL.hostname === "youtu.be") {
    videoId = youtubeURL.pathname.split("/").filter(Boolean)[0];
  }

  if (!videoId) {
    const pathParts = youtubeURL.pathname.split("/").filter(Boolean);
    const videoIndex = pathParts.findIndex(part =>
      ["live", "embed", "shorts"].includes(part)
    );

    if (videoIndex !== -1) {
      videoId = pathParts[videoIndex + 1];
    }
  }

  if (videoId) {
    const iframe = document.createElement("iframe");

    iframe.src =
      "https://www.youtube-nocookie.com/embed/" +
      encodeURIComponent(videoId);

    iframe.allowFullscreen = true;
    iframe.allow = "autoplay; encrypted-media; picture-in-picture";
    iframe.style.cssText = "width:100%;height:100%;border:0;";

    player.innerHTML = "";
    player.appendChild(iframe);
  } else {
    player.textContent = "Please provide a direct YouTube live video URL.";
  }
 } 
}
    vlChatForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const message = vlChatInput.value.trim();

  if (!message) return;

  const { data: sessionData } = await watchSupabase.auth.getSession();

  if (!sessionData.session) {
    alert("Please sign in to send messages.");
    return;
  }
    const { data: activeRestriction, error: restrictionCheckError } = await watchSupabase
  .from("void_live_chat_restrictions")
  .select("restriction_type, expires_at")
  .eq("stream_id", streamId)
  .eq("user_id", sessionData.session.user.id)
  .maybeSingle();

if (restrictionCheckError) {
  console.error("Could not check chat restrictions:", restrictionCheckError);
  alert("Could not verify your chat permissions.");
  return;
}

if (
  activeRestriction &&
  (
    activeRestriction.restriction_type === "ban" ||
    (
      activeRestriction.restriction_type === "timeout" &&
      activeRestriction.expires_at &&
      new Date(activeRestriction.expires_at) > new Date()
    )
  )
) {
  alert(
    activeRestriction.restriction_type === "ban"
      ? "You are banned from this stream's chat."
      : "You are timed out from this chat."
  );
  return;
}
  const { error } = await watchSupabase
    .from("void_live_chat")
    .insert({
      stream_id: streamId,
      user_id: sessionData.session.user.id,
      message: message
    });

  if (error) {
    console.error("Could not send message:", error);
    alert("Could not send your message.");
    return;
  }

  vlChatInput.value = "";
  await loadLiveChat();
});
    
   vlFollowButton.addEventListener("click", async () => {
  const { data: sessionData } = await watchSupabase.auth.getSession();
  const currentFollower = sessionData.session?.user;

  if (!currentFollower) return;

  const isFollowing = vlFollowButton.textContent === "UNFOLLOW STREAMER";

  if (isFollowing) {
    const { error } = await watchSupabase
      .from("void_live_follows")
      .delete()
      .eq("follower_id", currentFollower.id)
      .eq("streamer_id", streamOwnerId);

    if (error) {
      console.error("Could not unfollow streamer:", error);
      return;
    }

    vlFollowButton.textContent = "FOLLOW STREAMER";
  } else {
    const { error } = await watchSupabase
      .from("void_live_follows")
      .insert({
        follower_id: currentFollower.id,
        streamer_id: streamOwnerId
      });

    if (error) {
      console.error("Could not follow streamer:", error);
      return;
    }

    vlFollowButton.textContent = "UNFOLLOW STREAMER";
  }
});
    
  loadWatchedStream();
    loadLiveChat();

setInterval(loadLiveChat, 10000);
