
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090611">
  <title>WATCH STREAM | NOCTURNE VOID</title>

  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>

<body class="void-live-page">

  <header class="vl-header">
    <a href="void-live.html" class="vl-logo">
      NOCTURNE <span>VOID</span>
    </a>

    <nav class="vl-nav">
      <a href="index.html">HOME</a>
      <a href="community.html">COMMUNITY</a>
      <a href="void-live.html">VOID LIVE</a>
    </nav>
  </header>

  <main class="vl-main">

    <section class="vl-hero">
      <p class="vl-eyebrow">NOW ENTERING THE VOID</p>
      <h1>LIVE <span>STREAM</span></h1>
    </section>

    <section class="vl-watch-section">

      <div id="vlVideoPlayer" class="vl-video-player">
        <div class="vl-video-placeholder">
          <h2>STREAM PLAYER</h2>
          <p>Waiting for the broadcast...</p>
        </div>
      </div>

      <div class="vl-watch-info">
        <h2 id="vlWatchTitle">Loading stream...</h2>
        <p id="vlWatchGame"></p>
        <p id="vlWatchDescription"></p>
      </div>

    </section>
    <section class="vl-chat-section">

  <h2>LIVE <span>CHAT</span></h2>

  <div id="vlChatMessages" class="vl-chat-messages">
    <p class="vl-empty">Welcome to the VOID. Chat is loading...</p>
  </div>

  <form id="vlChatForm" class="vl-chat-form">
    <input
      type="text"
      id="vlChatInput"
      placeholder="Send a message..."
      maxlength="500"
      required
    >

    <button type="submit">SEND</button>
  </form>

</section>

  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  const watchSupabase = window.supabase.createClient(
    "https://huzjjefknbicqxbhcryk.supabase.co",
    "sb_publishable_CxmbXvQwPwOSC0WDx5HJng_qytHjcqc"
  );
      const streamParams = new URLSearchParams(window.location.search);
  const streamId = streamParams.get("id");
    const vlChatMessages = document.getElementById("vlChatMessages");
const vlChatForm = document.getElementById("vlChatForm");
const vlChatInput = document.getElementById("vlChatInput");

    async function loadLiveChat() {
  if (!streamId) return;

  const { data: messages, error } = await watchSupabase
    .from("void_live_chat")
    .select("id, user_id, message, created_at")
    .eq("stream_id", streamId)
    .order("created_at", { ascending: true })
    .limit(100);

  if (error) {
    console.error("Could not load live chat:", error);
    vlChatMessages.textContent = "Could not load chat messages.";
    return;
  }

  vlChatMessages.innerHTML = "";

  if (!messages || messages.length === 0) {
    vlChatMessages.textContent = "No messages yet. Start the conversation!";
    return;
  }

  messages.forEach(message => {
    const messageElement = document.createElement("div");
    messageElement.className = "vl-chat-message";

    const sender = document.createElement("strong");
    sender.textContent = "VOID MEMBER";

    const content = document.createElement("p");
    content.textContent = message.message;

    messageElement.append(sender, content);
    vlChatMessages.appendChild(messageElement);
  });

  vlChatMessages.scrollTop = vlChatMessages.scrollHeight;
}
    vlChatForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const message = vlChatInput.value.trim();
  if (!message) return;

  const { data: sessionData } = await watchSupabase.auth.getSession();

  if (!sessionData.session) {
    alert("Please sign in to send messages.");
    return;
  }

  const { error } = await watchSupabase
    .from("void_live_chat")
    .insert({
      stream_id: streamId,
      user_id: sessionData.session.user.id,
      message: message
    });

  if (error) {
    console.error("Chat message error:", error);
    alert("Could not send your message.");
    return;
  }

  vlChatInput.value = "";
  await loadLiveChat();
});

  async function loadWatchedStream() {
    if (!streamId) {
      document.getElementById("vlWatchTitle").textContent =
        "No stream selected";
      return;
    }

    const { data: stream, error } = await watchSupabase
      .from("void_live_streams")
      .select("*")
      .eq("id", streamId)
      .eq("is_live", true)
      .single();

    if (error || !stream) {
      document.getElementById("vlWatchTitle").textContent =
        "Stream not found or offline.";
      return;
    }

    document.getElementById("vlWatchTitle").textContent =
      stream.stream_title;

    document.getElementById("vlWatchGame").textContent =
      "Playing: " + stream.game_name;

    document.getElementById("vlWatchDescription").textContent =
      stream.description || "";
  }

  loadWatchedStream();
    loadLiveChat();

setInterval(loadLiveChat, 3000);
    
</script>
</body>
</html>
