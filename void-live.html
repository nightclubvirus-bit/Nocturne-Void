
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090611">
  <title>VOID LIVE | NOCTURNE VOID</title>

  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>

<body class="void-live-page">

  <header class="vl-header">
    <a href="index.html" class="vl-logo">
      NOCTURNE <span>VOID</span>
    </a>

    <nav class="vl-nav">
      <a href="index.html">HOME</a>
      <a href="community.html">COMMUNITY</a>
      <a href="account.html">ACCOUNT</a>
    </nav>

    <button class="vl-go-live" id="vlGoLive">
      GO LIVE
    </button>
  </header>

  <main class="vl-main">

    <section class="vl-hero">
      <p class="vl-eyebrow">THE GAMING UNIVERSE</p>
      <h1>VOID <span>LIVE</span></h1>
      <p>WATCH. PLAY. CONNECT. ENTER THE VOID.</p>
    </section>

    <section class="vl-featured">
      <h2>FEATURED STREAMS</h2>
      <p>Discover creators from across the VOID.</p>

      <div id="vlFeaturedStreams" class="vl-stream-grid">
        <p class="vl-empty">
          No featured streams yet. Be the first to go live.
        </p>
      </div>
    </section>

    <section class="vl-browse">
      <h2>LIVE CHANNELS</h2>

      <div id="vlLiveStreams" class="vl-stream-grid">
        <p class="vl-empty">
          No one is streaming right now.
        </p>
      </div>
    </section>

  </main>

</body>
</html>
